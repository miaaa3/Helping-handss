<app-main-navbar></app-main-navbar>

<div class="bg-gray-200 font-rale min-h-screen">
<div class="flex max-w-7xl mx-auto">

<!--LEFT SIDEBAR: nav shortcuts-->
<aside class="left-sidebar-area w-64 hidden lg:block mt-24 px-4">
  <div class="sticky top-24 flex flex-col gap-4">
    <app-main-sidebar></app-main-sidebar>
  </div>
</aside>
<!--END LEFT SIDEBAR-->

<main class="flex-1 min-w-0 max-w-5xl mx-auto pt-24 px-4 pb-6">
    <div class="flex h-[75vh] rounded-xl bg-white-chalk shadow-lg overflow-hidden">

      <!-- CONVERSATIONS -->
      <div class="w-full sm:w-80 border-r border-gray-200 flex-shrink-0" [ngClass]="{ 'hidden sm:block': selectedConversation }">
        <app-conversation-list
          [conversations]="conversations"
          [selectedUserId]="selectedConversation?.otherUserId ?? null"
          (select)="selectConversation($event)"
        ></app-conversation-list>
      </div>

      <!-- CHAT WINDOW -->
      <div class="flex-1" [ngClass]="{ 'hidden sm:block': !selectedConversation }">
        <app-chat-window
          [otherUserId]="selectedConversation?.otherUserId ?? null"
          [otherUserName]="selectedConversation?.otherUserName ?? ''"
          [otherUserProfile]="selectedConversation?.otherUserProfile ?? ''"
        ></app-chat-window>
      </div>

    </div>
</main>

</div>
</div>
