


<!-- NAVBAR -->
<nav class=" fixed flex dark:bg-slate-900 items-center justify-between bg-white-chalk px-3 py-4 w-full z-10 bg-white bg-clip-border text-gray-800 shadow-md">
  <div>
    <img src="assets/images/n.png" class="h-10 w-48 ml-0" alt="Helping Hands Logo" />
</div>

   <!-- SEARCH BAR -->
   <div class="content-center justify-evenly flex mr-40">
    <label class="block text-sm w-[400px] relative">
      <div class="relative text-gray-500">
        <input class="block w-full h-8 rounded-lg mr-2 mt-1 text-sm text-gray-900 border-gray-500 bg-whitesmoke-default pl-2"
          placeholder="Search..."  [(ngModel)]="searchKeyword" (input)="onSearchInput()" (focus)="onSearchInput()"/>
        <img class="absolute inset-y-0 right-2  w-5 mt-1" src="assets/images/icon-search.png">
      </div>
    </label>
    <div *ngIf="showSearchResults" class="mt-9 absolute overflow-hidden bg-white-chalk rounded-md d rounded-t-none w-[400px] shadow-lg z-20">
      <ul *ngIf="searchResults.length > 0">
        <li *ngFor="let user of searchResults ; let i = index" class="flex items-center px-3 py-1  hover:bg-gray-100 ">
          <img
            class="w-8 h-8 rounded-full mr-2 border-2 border-white object-cover"
            [src]="user.user.profile || 'assets/images/default-avatar.png'"
            alt=""
          />
          <div class="flex content-center justify-between items-center w-full">
            <div class="text-sm font-rale truncate">{{ user.user.name }}</div>

            <div class="pt-0 flex justify-end items-center gap-1.5 flex-shrink-0">
              <button
                class="select-none w-7 h-6 flex items-center justify-center rounded-lg bg-gray-200 hover:bg-gray-300 transition-all"
                type="button"
                title="Message"
                (click)="messageUser(user.user)"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.86 9.86 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                </svg>
              </button>
              <button
                class="select-none w-[50px] h-6 rounded-lg
                  {{ user.followed ? 'bg-red-600' : 'bg-green' }}
                  text-center align-middle text-xs font-semibold text-white
                  shadow-md shadow-green-light/10 transition-all hover:shadow-lg
                  hover:shadow-green-light/50 focus:opacity-[0.85] focus:shadow-none
                  active:opacity-[0.85] active:shadow-none"
                type="button"
                data-ripple-light="true"
                (click)="follow(user.user.id!)"
              >
                {{  user.followed ? 'Unfollow' : 'Follow' }}
              </button>
            </div>

          </div>
        </li>
      </ul>
      <div *ngIf="searchResults.length === 0" class="px-3 py-3 text-sm text-gray-500 font-rale text-center">
        No users found.
      </div>
    </div>
  </div>

    <!--END SEARCH BAR-->

    <div class="flex justify-center items-center gap-2 ">
      <!--ICONS-->
        <!--MESSAGES-->
        <div routerLink="/messages" class="w-7 hover:ring-4 cursor-pointer relative ring-blue-700/30 rounded-full" title="Messages">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.86 9.86 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
          </svg>
        </div>
        <!--END MESSAGES-->
        <div (click)="toggleDropdownNotif()"  class="w-7 hover:ring-4  cursor-pointer relative ring-blue-700/30 rounded-full ">
          <img src="/assets/images/icon-notifications.png" alt="">
          <div [ngClass]="showDropdownNotif ? 'block' : 'hidden'" class="drop-down  w-64 overflow-hidden bg-white rounded-md shadow absolute top-12 right-3">
            <div class="py-2"  >
              <div class="flex items-center px-4 py-3 border-b hover:bg-gray-100 -mx-2" *ngFor="let notification of notifications">
                  <img class="h-8 w-8 rounded-full object-cover mx-1" [src]="notification.user.profile" alt="avatar">
                  <p class="text-gray-600 text-sm mx-2 cursor-pointer">
                      <span class="font-bold" >{{notification.user.name}}</span> {{notification.notification.message}} 
                  </p>
              </div>
            </div>
            <a href="#" class="block bg-green text-white text-center font-bold py-2">See all notifications</a>
        </div>
      </div>
    
  <!--END ICONS-->

    
    <!--DROPDOWN-->
      <div (click)="toggleDropdown()" class="h-10 w-10 hover:ring-4  cursor-pointer relative ring-blue-700/30 rounded-full bg-cover bg-center bg-[url('https://avatars.githubusercontent.com/u/67946056?v=4')]">
         <div [ngClass]="showDropdown ? 'block' : 'hidden'" class="drop-down  w-48 overflow-hidden bg-white rounded-md shadow absolute top-12 right-3">
          <ul>
            <li class="px-3 py-3 text-sm font-medium flex items-center space-x-2 hover:bg-gray-100">
              <span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
              </span>
              <span> Setting </span>
            </li>
            <li class="px-3  py-3  text-sm font-medium flex items-center space-x-2 hover:bg-slate-400">
              <span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                 <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                </svg>
              </span>
              <span> Profile </span>
            </li>
            <li class="px-3  py-3 text-sm font-medium flex items-center space-x-2 hover:bg-slate-400">
              <span>
           <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
              </span>
              <button (click)="logout()"> Logout </button>
            </li>
          </ul>
        </div>
      </div>
      <!--END DROPDOWN-->
    </div>  

    </nav>
    
    <!--END NAVBAR-->
