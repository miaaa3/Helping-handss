<!--NEW FEED AREA-->
<div class="p-4 mt-24 flex  items-center w-[813px] flex-col  ">
 
  <!-- CREATE POST -->
  <div class=" mx-auto w-full flex flex-col text-gray-800 border border-gray-300 p-4 rounded-xl bg-white-chalk shadow-lg max-w-2xl">
    <div class="inline-flex items-center">
        <img class="w-10 mx-3  rounded-full " src="https://avatars.githubusercontent.com/u/67946056?v=4" alt="">
        <textarea class="description text-base  bg-gray-100 sec p-3 h-11 w-full border rounded-xl border-gray-300 outline-none overflow-hidden" spellcheck="false" name="content" placeholder="Describe everything about this post here" [(ngModel)]="post.content" ></textarea>
    </div>    
    <div class="flex items-center ml-2 mt-3">
        <img class="mr-2 cursor-pointer  rounded-full p-1 h-8" src="assets/images/icon-location.png">        
        <div class="flex items-center justify-center w-8 h-4">
            <label for="dropzone-file" class="flex flex-col items-center justify-center w-full h-6 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 dark:hover:bg-bray-800 dark:bg-gray-700 hover:bg-gray-100 dark:border-gray-600 dark:hover:border-gray-500 dark:hover:bg-gray-600">
                <div class="flex flex-col items-center justify-center ">
                    <svg class=" h-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                    </svg>
                </div>
                <input id="dropzone-file" type="file" class="hidden" (change)="onFileSelected($event)" />
            </label>
        </div> 
        <div class="btn ml-auto  px-2.5 py-1.5 font-semibold cursor-pointer rounded-md bg-green  text-center align-middle text-sm uppercase text-white shadow-md shadow-green-light/10 transition-all hover:shadow-lg hover:shadow-green-light/50 focus:opacity-[0.85] focus:shadow-none active:opacity-[0.85] active:shadow-none disabled:pointer-events-none disabled:opacity-50 disabled:shadow-none" (click)="createPost()">Post</div>
    </div>
  </div>
  <!-- END CREATE POST -->
    

  <!--ALL POST-->
  <div class=" w-full flex justify-center  ">
      <app-post></app-post>
  </div>
  <!-- END ALL POST-->
</div>
<!--END NEW FEED AREA-->
