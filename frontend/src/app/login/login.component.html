<app-navbar-welcomepage></app-navbar-welcomepage>

<div class="font-rale min-h-[calc(100vh-88px)] flex items-center justify-center bg-white px-4 py-10">

  <!--Error toast-->
  <div *ngIf="isToastVisible" class="fixed top-24 right-6 z-50 shadow-lg rounded-lg bg-red-100 border border-red-400 text-red-700 p-4 w-72 flex items-start gap-2">
    <svg class="fill-current text-red-600 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22">
      <path class="heroicon-ui" d="M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20zm0-2a8 8 0 1 0 0-16 8 8 0 0 0 0 16zm-3.54-4.54a5 5 0 0 1 7.08 0 1 1 0 0 1-1.42 1.42 3 3 0 0 0-4.24 0 1 1 0 0 1-1.42-1.42zM9 11a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm6 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/>
    </svg>
    <div class="text-sm font-semibold tracking-tight">{{errorMessage}}</div>
  </div>
  <!--Error toast-->

  <div class="flex flex-col lg:flex-row w-full max-w-4xl bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">

    <!-- Branded panel -->
    <div class="lg:w-1/2 bg-green flex flex-col items-center justify-center text-center p-10 gap-4">
      <img src="assets/images/heart-shaped.png" class="h-40">
      <h2 class="font-Unica text-3xl text-white">Welcome Back!</h2>
      <p class="text-white/90 text-sm max-w-xs">Sign in to keep making a difference with Helping Hands.</p>
    </div>

    <!-- Form panel -->
    <div class="lg:w-1/2 p-8 sm:p-10 flex flex-col justify-center">
      <form #form="ngForm">
        <h2 class="font-Unica text-2xl text-black mb-6">Sign In</h2>

        <div class="mb-4">
          <label for="email" class="block text-sm font-bold leading-6 text-gray-900">Email Address</label>
          <div class="mt-2">
            <input type="email" name="email" id="email" class="block w-full rounded-md border border-gray-300 bg-transparent py-2 px-3 text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-green-light focus:border-green-light sm:text-sm" placeholder="HelpingHands@example.com" [(ngModel)]="authenticationRequest.email" required email>
          </div>
        </div>

        <div class="mb-6">
          <label for="password" class="block text-sm font-bold leading-6 text-gray-900">Password</label>
          <div class="mt-2">
            <input type="password" name="password" id="password" class="block w-full rounded-md border border-gray-300 bg-transparent py-2 px-3 text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-green-light focus:border-green-light sm:text-sm" placeholder="********" [(ngModel)]="authenticationRequest.password">
          </div>
        </div>

        <button type="submit" class="w-full rounded-full bg-green hover:bg-green-light text-white font-semibold py-2.5 shadow-sm transition-colors" (click)="login()">Login</button>

        <p class="text-center text-sm text-gray-600 mt-6">
          New to Helping Hands?
          <a routerLink="/sign-up-volunteer" class="font-semibold text-green hover:text-green-light">Join as a volunteer</a>
          or
          <a routerLink="/sign-up-organization" class="font-semibold text-yellow-dollar hover:text-yellow-light">register your organization</a>.
        </p>
      </form>
    </div>
  </div>
</div>
