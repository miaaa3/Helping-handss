<app-navbar-welcomepage></app-navbar-welcomepage>

<div class="font-rale min-h-[calc(100vh-88px)] flex items-center justify-center bg-white px-4 py-10">

  <div class="flex flex-col lg:flex-row w-full max-w-5xl bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">

    <!-- Branded panel -->
    <div class="lg:w-[42%] relative bg-no-repeat bg-cover bg-center min-h-[220px]" style="background-image: url('assets/images/volunteer.jpg');">
      <div class="absolute inset-0 bg-green/70 flex flex-col items-center justify-center text-center p-8 gap-3">
        <img src="assets/images/heart-shaped.png" class="h-28">
        <h2 class="font-Unica text-3xl text-white">Join Our Team!</h2>
        <p class="text-white/90 text-sm max-w-xs">Become a volunteer and start making an impact in your community today.</p>
      </div>
    </div>

    <!-- Form panel -->
    <div class="lg:w-[58%] p-8 sm:p-10">
      <form (ngSubmit)="onSubmit()">
        <h2 class="font-Unica text-2xl text-black mb-6">Sign Up</h2>

        <div class="grid gap-4 sm:grid-cols-2 mb-4">
          <div>
            <label for="first-name" class="block text-sm font-medium leading-6 text-gray-900">Full Name</label>
            <div class="mt-2">
              <input type="text" name="first-name" id="first-name" autocomplete="given-name" class="block w-full rounded-md border border-gray-300 bg-transparent py-2 px-3 text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-green-light focus:border-green-light sm:text-sm" placeholder="First-name" [(ngModel)]="volunteer.fullName">
            </div>
          </div>
          <div>
            <label for="last-name" class="block text-sm font-medium leading-6 text-gray-900">Username</label>
            <div class="mt-2">
              <input type="text" name="last-name" id="last-name" autocomplete="family-name" class="block w-full rounded-md border border-gray-300 bg-transparent py-2 px-3 text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-green-light focus:border-green-light sm:text-sm" placeholder="Last-name" [(ngModel)]="volunteer.name">
            </div>
          </div>
        </div>

        <div class="grid gap-4 sm:grid-cols-2 mb-4">
          <div>
            <label for="email" class="block text-sm font-medium leading-6 text-gray-900">Email Address</label>
            <div class="mt-2">
              <input type="email" name="email" id="email" autocomplete="email" class="block w-full rounded-md border border-gray-300 bg-transparent py-2 px-3 text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-green-light focus:border-green-light sm:text-sm" placeholder="HelpingHands@example.com" [(ngModel)]="volunteer.email">
            </div>
          </div>
          <div>
            <label for="gender" class="block text-sm font-medium leading-6 text-gray-900">Gender</label>
            <div class="mt-2">
              <select id="gender" name="gender" autocomplete="gender" class="block w-full rounded-md border border-gray-300 bg-transparent py-2 px-3 text-gray-900 focus:outline-none focus:ring-2 focus:ring-green-light focus:border-green-light sm:text-sm h-[42px]" [(ngModel)]="volunteer.gender">
                <option value="FEMALE">Female</option>
                <option value="MALE">Male</option>
                <option value="OTHER">Other</option>
              </select>
            </div>
          </div>
        </div>

        <div class="grid gap-4 sm:grid-cols-2 mb-4">
          <div>
            <label for="phone" class="block text-sm font-medium leading-6 text-gray-900">Phone Number</label>
            <div class="mt-2">
              <input type="tel" name="phone" id="phone" autocomplete="tel" class="block w-full rounded-md border border-gray-300 bg-transparent py-2 px-3 text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-green-light focus:border-green-light sm:text-sm" placeholder="+123 4567890" [(ngModel)]="volunteer.phone">
            </div>
          </div>
          <div>
            <label for="birthdate" class="block text-sm font-medium leading-6 text-gray-900">Birthdate</label>
            <div class="mt-2">
              <input type="date" name="birthdate" id="birthdate" class="block w-full rounded-md border border-gray-300 bg-transparent py-2 px-3 text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-green-light focus:border-green-light sm:text-sm h-[42px]" [(ngModel)]="volunteer.birthdate">
            </div>
          </div>
        </div>

        <div class="grid gap-4 sm:grid-cols-2 mb-6">
          <div>
            <label for="address" class="block text-sm font-medium leading-6 text-gray-900">Address</label>
            <div class="mt-2">
              <input type="text" name="address" id="address" class="block w-full rounded-md border border-gray-300 bg-transparent py-2 px-3 text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-green-light focus:border-green-light sm:text-sm" placeholder="e.g. 123 Main St, City, State ZIP" [(ngModel)]="volunteer.address">
            </div>
          </div>
          <div>
            <label for="password" class="block text-sm font-medium leading-6 text-gray-900">Password</label>
            <div class="mt-2">
              <input type="password" name="password" id="password" class="block w-full rounded-md border border-gray-300 bg-transparent py-2 px-3 text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-green-light focus:border-green-light sm:text-sm" placeholder="Password" [(ngModel)]="volunteer.password">
            </div>
          </div>
        </div>

        <div class="flex flex-col sm:flex-row items-center gap-4">
          <button type="submit" class="w-full sm:w-auto rounded-full bg-green hover:bg-green-light text-white font-semibold px-10 py-2.5 shadow-sm transition-colors">Save</button>
          <p class="text-sm text-gray-600 sm:ml-auto">Registered already? <a routerLink="/login" class="font-semibold text-green hover:text-green-light">Login</a></p>
        </div>
      </form>
    </div>
  </div>
</div>
