<app-main-navbar></app-main-navbar>

<div class="bg-gray-200 font-rale min-h-screen">
<div class="flex max-w-7xl mx-auto">

<!--LEFT SIDEBAR: nav shortcuts-->
<aside class="left-sidebar-area w-64 hidden lg:block mt-24 px-4">
  <div class="sticky top-24 flex flex-col gap-4">
    <app-main-sidebar></app-main-sidebar>
  </div>
</aside>
<!--END LEFT SIDEBAR-->


<!--CENTER-->
<main class="flex-1 min-w-0 max-w-2xl mx-auto px-4 mt-24 pb-20 lg:pb-8 flex flex-col gap-4">

  <!--LOADING-->
  <div *ngIf="loading" class="bg-white-chalk rounded-xl shadow-md p-8 flex items-center justify-center text-sm text-gray-500">
    Loading settings...
  </div>

  <form *ngIf="!loading" id="settings-form" class="flex flex-col gap-4" (ngSubmit)="onSubmit()">

    <!--HEADER / AVATAR-->
    <div class="bg-white-chalk rounded-xl shadow-md overflow-hidden">
      <div class="h-20 bg-gradient-to-r from-green to-green-dark"></div>
      <div class="px-6 pb-6 -mt-10 flex items-end gap-4">
        <img class="w-20 h-20 rounded-full border-4 border-white-chalk object-cover flex-shrink-0" [src]="volunteer.profile" alt="">
        <div class="pb-1">
          <h1 class="text-lg font-semibold capitalize">{{volunteer.name}}</h1>
          <div class="text-xs text-green font-semibold uppercase tracking-wide">{{volunteer.role}}</div>
        </div>
      </div>
    </div>
    <!--END HEADER / AVATAR-->

    <!--PROFILE DETAILS-->
    <div class="bg-white-chalk rounded-xl shadow-md p-4 flex flex-col gap-4">
      <h5 class="text-sm font-semibold text-gray-900">Profile details</h5>

      <div *ngIf="isVolunteer" class="flex flex-col gap-1">
        <label for="fullName" class="text-xs font-semibold text-gray-700">Full name</label>
        <input id="fullName" name="fullName" type="text" [(ngModel)]="volunteer.fullName"
          class="bg-gray-100 rounded-lg px-3 py-2 text-sm border border-transparent outline-none focus:border-green/40 transition-colors"
          placeholder="Your full name">
      </div>

      <div class="flex flex-col gap-1">
        <label for="email" class="text-xs font-semibold text-gray-700">Email</label>
        <input id="email" name="email" type="email" [value]="volunteer.email" disabled
          class="bg-gray-100 rounded-lg px-3 py-2 text-sm border border-transparent text-gray-400 cursor-not-allowed">
      </div>

      <div class="flex flex-col gap-1">
        <label for="phone" class="text-xs font-semibold text-gray-700">Phone</label>
        <input id="phone" name="phone" type="text" [(ngModel)]="volunteer.phone"
          class="bg-gray-100 rounded-lg px-3 py-2 text-sm border border-transparent outline-none focus:border-green/40 transition-colors"
          placeholder="Your phone number">
      </div>

      <div class="flex flex-col gap-1">
        <label for="address" class="text-xs font-semibold text-gray-700">Location</label>
        <input id="address" name="address" type="text" [(ngModel)]="volunteer.address"
          class="bg-gray-100 rounded-lg px-3 py-2 text-sm border border-transparent outline-none focus:border-green/40 transition-colors"
          placeholder="City, Country">
      </div>

      <div class="flex flex-col gap-1">
        <label for="profile" class="text-xs font-semibold text-gray-700">Profile picture URL</label>
        <input id="profile" name="profile" type="text" [(ngModel)]="volunteer.profile"
          class="bg-gray-100 rounded-lg px-3 py-2 text-sm border border-transparent outline-none focus:border-green/40 transition-colors"
          placeholder="https://...">
      </div>

      <div class="flex flex-col gap-1">
        <label for="about" class="text-xs font-semibold text-gray-700">About</label>
        <textarea id="about" name="about" rows="4" maxlength="200" [(ngModel)]="volunteer.bio"
          class="bg-gray-100 rounded-lg px-3 py-2 text-sm border border-transparent outline-none focus:border-green/40 transition-colors resize-none"
          placeholder="Let the world know who you are"></textarea>
        <p class="text-right text-xs text-gray-400">{{(volunteer.bio?.length || 0)}}/200</p>
      </div>
    </div>
    <!--END PROFILE DETAILS-->

    <!--INTERESTS (volunteers only)-->
    <div *ngIf="isVolunteer" class="bg-white-chalk rounded-xl shadow-md p-4">
      <h5 class="text-sm font-semibold text-gray-900 mb-3">Interests</h5>
      <div class="flex flex-wrap gap-2">
        <button *ngFor="let interest of interests" type="button" (click)="toggleSelection(interest)"
          class="text-xs font-semibold rounded-full px-3 py-1.5 border transition-colors"
          [ngClass]="isSelected(interest) ? 'bg-green text-white border-green' : 'text-gray-600 border-gray-300 hover:bg-gray-100'">
          {{interest}}
        </button>
      </div>
    </div>
    <!--END INTERESTS-->

    <!--ORGANIZATION DETAILS (organizations only)-->
    <div *ngIf="isOrganization" class="bg-white-chalk rounded-xl shadow-md p-4 flex flex-col gap-4">
      <h5 class="text-sm font-semibold text-gray-900">Organization details</h5>

      <div class="flex flex-col gap-1">
        <label for="type" class="text-xs font-semibold text-gray-700">Type</label>
        <input id="type" name="type" type="text" [(ngModel)]="volunteer.type"
          class="bg-gray-100 rounded-lg px-3 py-2 text-sm border border-transparent outline-none focus:border-green/40 transition-colors"
          placeholder="e.g. Non-profit, NGO, Charity">
      </div>

      <div class="flex flex-col gap-1">
        <label for="founder" class="text-xs font-semibold text-gray-700">Founder</label>
        <input id="founder" name="founder" type="text" [(ngModel)]="volunteer.founder"
          class="bg-gray-100 rounded-lg px-3 py-2 text-sm border border-transparent outline-none focus:border-green/40 transition-colors"
          placeholder="Founder name">
      </div>

      <div class="flex flex-col gap-1">
        <label for="website" class="text-xs font-semibold text-gray-700">Website</label>
        <input id="website" name="website" type="text" [(ngModel)]="volunteer.website"
          class="bg-gray-100 rounded-lg px-3 py-2 text-sm border border-transparent outline-none focus:border-green/40 transition-colors"
          placeholder="https://...">
      </div>

      <div class="flex flex-col gap-1">
        <label for="description" class="text-xs font-semibold text-gray-700">Description</label>
        <textarea id="description" name="description" rows="4" [(ngModel)]="volunteer.description"
          class="bg-gray-100 rounded-lg px-3 py-2 text-sm border border-transparent outline-none focus:border-green/40 transition-colors resize-none"
          placeholder="What does your organization do?"></textarea>
      </div>

      <div class="flex flex-col gap-1">
        <label for="campaignGoal" class="text-xs font-semibold text-gray-700">Campaign goal</label>
        <input id="campaignGoal" name="campaignGoal" type="number" min="0" step="1" [(ngModel)]="volunteer.campaignGoal"
          class="bg-gray-100 rounded-lg px-3 py-2 text-sm border border-transparent outline-none focus:border-green/40 transition-colors"
          placeholder="Total fundraising goal (optional)">
        <p class="text-xs text-gray-400">Shown as a donation progress bar on your profile.</p>
      </div>
    </div>
    <!--END ORGANIZATION DETAILS-->

    <!--ACTIONS-->
    <div class="bg-white-chalk rounded-xl shadow-md p-4 flex justify-end gap-3">
      <a routerLink="/user-profile"
        class="text-sm font-semibold px-5 py-1.5 rounded-full bg-gray-100 text-gray-700 hover:bg-gray-200 transition-colors">
        Cancel
      </a>
      <button type="submit" [disabled]="saving"
        class="bg-green text-white text-sm font-semibold px-6 py-1.5 rounded-full shadow-sm transition-all hover:shadow-md hover:bg-green-dark active:opacity-80 disabled:opacity-60">
        {{ saving ? 'Saving...' : 'Save changes' }}
      </button>
    </div>
    <!--END ACTIONS-->

  </form>

</main>
<!--END CENTER-->

</div>
</div>
