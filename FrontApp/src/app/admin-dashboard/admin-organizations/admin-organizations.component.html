<div *ngIf="loading" class="flex justify-center py-12">
  <mat-spinner diameter="36"></mat-spinner>
</div>

<div *ngIf="!loading" class="bg-white-chalk rounded-xl shadow-md p-4">
  <div *ngIf="!organizations.length" class="text-sm text-gray-500 text-center py-4">
    No organizations found.
  </div>

  <div *ngFor="let org of organizations" class="flex items-center justify-between gap-3 py-3 border-b border-gray-100 last:border-b-0">
    <div class="flex items-center gap-3 min-w-0">
      <app-avatar [src]="org.profile" [name]="org.name" sizeClass="w-10 h-10 rounded-full object-cover flex-shrink-0"></app-avatar>
      <div class="min-w-0">
        <div class="text-sm font-medium text-gray-900 truncate">{{ org.name }}</div>
        <div class="text-xs text-gray-500 truncate">{{ org.email }} &middot; {{ org.type }}</div>
      </div>
    </div>
    <div class="flex items-center gap-2 flex-shrink-0">
      <span class="text-xs font-semibold px-2.5 py-1 rounded-full capitalize" [ngClass]="statusClass(org.verificationStatus)">
        {{ org.verificationStatus | lowercase }}
      </span>

      <mat-spinner *ngIf="updatingId === org.id" diameter="18"></mat-spinner>

      <ng-container *ngIf="updatingId !== org.id">
        <button *ngIf="org.verificationStatus !== 'VERIFIED'" (click)="setVerification(org, 'VERIFIED')"
          class="bg-green text-white text-xs font-semibold px-3 py-1 rounded-full shadow-sm transition-all hover:shadow-md hover:bg-green-dark active:opacity-80">
          Verify
        </button>
        <button *ngIf="org.verificationStatus !== 'REJECTED'" (click)="setVerification(org, 'REJECTED')"
          class="bg-white-chalk border border-gray-200 text-red-500 text-xs font-semibold px-3 py-1 rounded-full transition-colors hover:bg-red-50">
          Reject
        </button>
        <button *ngIf="org.verificationStatus !== 'PENDING'" (click)="setVerification(org, 'PENDING')"
          class="text-xs font-medium text-gray-500 hover:text-gray-700 transition-colors">
          Reset
        </button>
      </ng-container>
    </div>
  </div>
</div>
