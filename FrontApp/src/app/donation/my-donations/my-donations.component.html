<div class="my-donations-container">
  <h1 class="my-donations-title">My Donations</h1>

  <div *ngIf="loading" class="my-donations-loading">
    <mat-spinner diameter="32"></mat-spinner>
  </div>

  <p *ngIf="errorMessage" class="my-donations-error">{{ errorMessage }}</p>

  <p *ngIf="!loading && !errorMessage && donations.length === 0" class="my-donations-empty">
    You haven't made any donations yet.
  </p>

  <div class="donation-list" *ngIf="!loading && donations.length > 0">
    <div class="donation-card" *ngFor="let donation of donations">
      <div class="donation-card-main">
        <span class="donation-org">{{ donation.organizationName }}</span>
        <span class="donation-amount">{{ donation.amount | number:'1.2-2' }} {{ donation.currency.toUpperCase() }}</span>
      </div>
      <div class="donation-card-meta">
        <span class="donation-date">{{ donation.createdAt | date:'medium' }}</span>
        <span class="donation-status" [ngClass]="'status-' + donation.status.toLowerCase()">{{ donation.status }}</span>
      </div>
      <p class="donation-message" *ngIf="donation.message">"{{ donation.message }}"</p>
    </div>
  </div>
</div>
