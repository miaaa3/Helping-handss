<app-main-navbar></app-main-navbar>

<div class="bg-gray-200 font-rale min-h-screen">
<div class="flex max-w-7xl mx-auto">

<!--LEFT SIDEBAR: nav shortcuts-->
<aside class="left-sidebar-area w-64 hidden lg:block mt-24 px-4">
  <div class="sticky top-24 flex flex-col gap-4">
    <app-main-sidebar></app-main-sidebar>
  </div>
</aside>
<!--END LEFT SIDEBAR-->


<!--CENTER-->
<main class="flex-1 min-w-0 max-w-2xl mx-auto px-4 mt-24 pb-20 lg:pb-8 flex flex-col gap-4">

  <!-- FOLLOW REQUESTS SECTION -->
  <div *ngIf="pendingRequests.length > 0" class="bg-white-chalk rounded-xl shadow-md overflow-hidden">
    <div class="px-4 py-3 border-b border-gray-100 flex items-center gap-2">
      <span class="text-sm font-semibold text-gray-900">Follow Requests</span>
      <span class="bg-green text-white text-xs font-bold rounded-full px-2 py-0.5">{{ pendingRequests.length }}</span>
    </div>
    <div *ngFor="let req of pendingRequests" class="flex items-center gap-3 px-4 py-3 border-b last:border-b-0 border-gray-100">
      <img [src]="req.follower.profile || 'assets/images/avatar-default.png'" class="w-10 h-10 rounded-full object-cover flex-shrink-0" alt="">
      <div class="flex-1 min-w-0">
        <span class="font-semibold text-sm capitalize">{{ req.follower.name }}</span>
        <span class="text-sm text-gray-500"> wants to follow you</span>
      </div>
      <div class="flex gap-2 flex-shrink-0">
        <button (click)="acceptRequest(req)"
          class="text-xs font-semibold px-4 py-1.5 rounded-full bg-green text-white hover:bg-green-dark transition-colors">
          Accept
        </button>
        <button (click)="rejectRequest(req)"
          class="text-xs font-semibold px-4 py-1.5 rounded-full bg-gray-100 text-gray-600 hover:bg-gray-200 transition-colors">
          Decline
        </button>
      </div>
    </div>
  </div>
  <!-- END FOLLOW REQUESTS SECTION -->

  <div class="bg-white-chalk rounded-xl shadow-md p-4 flex items-center justify-between">
    <h1 class="text-base font-semibold text-gray-900">Notifications</h1>
    <button *ngIf="unreadCount > 0" (click)="markAllAsRead()"
            class="text-xs font-semibold text-green hover:underline">
      Mark all as read
    </button>
  </div>

  <!--INITIAL LOADING-->
  <div *ngIf="initialLoad && loading" class="bg-white-chalk rounded-xl shadow-md p-8 flex items-center justify-center text-sm text-gray-500">
    Loading notifications...
  </div>

  <!--EMPTY-->
  <div *ngIf="!initialLoad && notifications.length === 0" class="bg-white-chalk rounded-xl shadow-md p-8 text-center text-sm text-gray-500">
    You're all caught up.
  </div>

  <!--NOTIFICATIONS LIST-->
  <div *ngIf="notifications.length > 0" class="bg-white-chalk rounded-xl shadow-md divide-y divide-gray-100">
    <a *ngFor="let item of notifications" (click)="openNotification(item)"
       class="flex items-center gap-3 px-4 py-3 hover:bg-gray-100 transition-colors cursor-pointer"
       [ngClass]="item.isRead ? '' : 'bg-green/5'">
      <app-avatar [src]="item.actorProfile" [name]="item.actorName" sizeClass="w-10 h-10 rounded-full object-cover flex-shrink-0"></app-avatar>
      <span class="text-lg flex-shrink-0">{{ iconFor(item.notificationType) }}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm text-gray-700">
          <span class="font-semibold capitalize">{{item.actorName}}</span> {{item.message}}
        </p>
        <time class="text-xs text-gray-400">{{item.createdAt | date:'medium'}}</time>
      </div>
      <span *ngIf="!item.isRead" class="h-2 w-2 rounded-full bg-green flex-shrink-0"></span>
    </a>
  </div>
  <!--END NOTIFICATIONS LIST-->

  <!--LOADING MORE-->
  <div *ngIf="loading && !initialLoad" class="text-center text-sm text-gray-500 py-2">
    Loading more...
  </div>

</main>
<!--END CENTER-->

</div>
</div>
