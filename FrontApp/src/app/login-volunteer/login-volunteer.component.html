      <div class="items-center flex min-h-screen ">
        <div class="container mx-auto ">
          <div class="flex flex-col justify-center lg:flex-row w-10/12 bg-white rounded-xl h-[350px] mx-auto shadow-lg overflow-hidden ">
            <div class="w-full lg:w-[47%]  flex flex-col items-center justify-center  bg-no-repeat bg-cover bg-center " style="background-image: url('assets/images/change.png'); background-size: 80%;">

            </div>
            <div class=" lg:w-1/2 py-5 px-7">
              <form #form="ngForm" >
                  <div class="border-b border-gray-900/10 pb-12">
                    <h2 class="text-xl font-black leading-9 text-gray-900 ">Sign In</h2>
  
                    <div class="gap-6" style="margin-top: 12px; margin-bottom: 12px; ">
                      <div class="sm:col-span-4">
                        <label for="email" class="block text-sm  leading-6 text-gray-900  font-bold">Address Email</label>
                        <div class="mt-2">
                          <div class="flex rounded-md shadow-sm ring-1 ring-inset ring-gray-400 focus-within:ring-2 focus-within:ring-inset focus-within:ring-teal-600 sm:max-w-xl ">
                          <input type="email" name="email" id="email"  class="block flex-1 border border-gray-400 rounded-md	bg-transparent py-1.5 pl-1 text-gray-900 placeholder:text-gray-400 focus:ring-0 sm:text-sm sm:leading-6 " placeholder="HelpingHands@example.com"  [(ngModel)]="authenticationRequest.email" required email>
                          </div>
                        </div>
                      </div>
                      <div class="sm:col-span-4 ">
                        <label for="password" class="block text-sm  font-bold leading-6 text-gray-900">Password</label>
                        <div class="mt-2">
                          <div class="flex rounded-md shadow-sm ring-1 ring-inset ring-gray-400 focus-within:ring-2 focus-within:ring-inset focus-within:ring-teal-600 sm:max-w-xl">
                            <input type="password" name="password" id="password" class="block flex-1 border border-gray-400 rounded-md	 bg-transparent py-1.5 pl-1 text-gray-900 placeholder:text-gray-400 focus:ring-0 sm:text-sm sm:leading-6  " placeholder="********"  [(ngModel)]="authenticationRequest.password">
                          </div>
                        </div>
                      </div>
                  </div>
  
                <div class="mt-6 flex items-center justify-start gap-x-6">
                  <button type="submit" class="rounded-md w-24 bg-green  py-1 text-lg font-semibold text-white shadow-sm hover:bg-green-light focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-400" (click)="login()">login</button>
                </div>
              </div>
            </form>
          </div>
      </div>
    </div>
      </div>
      </div>
