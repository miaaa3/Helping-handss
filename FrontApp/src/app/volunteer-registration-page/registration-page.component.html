 

    <div class="min-h-screen py-4" style="background-image: linear-gradient(135deg, #ffffff, #c7cdd9) ;">
      
    
      <!--the registration form for volunteers -->
      <div class="container max-auto ">
        <div class="flex flex-col lg:flex-row w-10/12 bg-white rounded-xl lg:h-[520px] mx-auto shadow-lg overflow-hidden ">
          <div class="w-full lg:w-[47%]  flex flex-col items-center justify-center  bg-no-repeat bg-cover bg-center " style="background-image: url('assets/images/volunteer.jpg');">

          </div>
          <div class=" lg:w-1/2 py-2 px-7 mx-4" >
            <form (ngSubmit)="onSubmit()">
                <div class="border-b border-gray-900/10  mt-3 ">
                  <div class="flex justify-between items-center mb-2">
                    <h2 class="text-base font-bold leading-9 text-gray-900">Sign Up</h2>
                  </div>
                  <div class=" gap-3 flex flex-col sm:flex-row mb-3" >
                    <div class="sm:col-span-3 flex-grow sm:w-1/2">
                      <label for="first-name" class="block text-sm font-medium leading-6 text-gray-900">First Name</label>
                      <div class="mt-2">
                        <div class="flex rounded-md shadow-sm ring-1 ring-inset ring-gray-300 focus-within:ring-2 focus-within:ring-inset focus-within:ring-teal-600 sm:max-w-md md:max-w-xl ">
                          <input type="text" name="first-name" id="first-name" autocomplete="given-name" class="block flex-1 border border-gray-300 rounded-md  bg-transparent py-1.5 pl-2 text-gray-900 placeholder:text-gray-400 focus:ring-0 sm:text-sm sm:leading-5" placeholder="First-name" [(ngModel)]="volunteer.firstName">
                        </div>
                      </div>
                    </div>
                    <div class="sm:col-span-3 flex-grow sm:w-1/2 sm:mt-0">
                      <label for="last-name" class="block text-sm font-medium leading-6 text-gray-900">Last Name</label>
                      <div class="mt-2">
                        <div class="flex rounded-md shadow-sm ring-1 ring-inset ring-gray-300 focus-within:ring-2 focus-within:ring-inset focus-within:ring-teal-600 sm:max-w-md md:max-w-xl">
                          <input type="text" name="last-name" id="last-name" autocomplete="family-name" class="block flex-1 border border-gray-300 rounded-md  bg-transparent py-1.5 pl-2 text-gray-900 placeholder:text-gray-400 focus:ring-0 sm:text-sm sm:leading-5" placeholder="Last-name" [(ngModel)]="volunteer.lastName">
                        </div>
                      </div>
                    </div>
                  </div>
                  

                  <div class="gap-3 flex flex-col sm:flex-row mb-3 " >
                    <div class="sm:col-span-3 flex-grow sm:w-1/2">
                      <label for="email" class="block text-sm font-medium leading-6 text-gray-900">Email Address</label>
                      <div class="mt-2">
                        <div class="flex rounded-md shadow-sm ring-1 ring-inset ring-gray-300 focus-within:ring-2 focus-within:ring-inset focus-within:ring-teal-600 sm:max-w-md md:max-w-xl">
                          <input type="email" name="email" id="email" autocomplete="email" class="block flex-1 border border-gray-300 rounded-md  bg-transparent py-1.5 pl-2 text-gray-900 placeholder:text-gray-400 focus:ring-0 sm:text-sm sm:leading-5" placeholder="HelpingHands@example.com" [(ngModel)]="volunteer.email">
                        </div>
                      </div>
                    </div>
                    <div class="sm:col-span-3 flex-grow sm:w-1/2  sm:mt-0">
                      <label for="gender" class="block text-sm font-medium leading-6 text-gray-900">Gender</label>
                      <div class="mt-2">
                        <div class="flex rounded-md shadow-sm ring-1 ring-inset ring-gray-300 focus-within:ring-2 focus-within:ring-inset focus-within:ring-teal-600 sm:max-w-md md:max-w-xl">
                          <select id="gender" name="gender" autocomplete="gender" class="block flex-1 border border-gray-300 rounded-md  bg-transparent py-1.5 pl-2 text-gray-900 placeholder:text-gray-400 focus:ring-0 sm:text-sm sm:leading-5 h-8" [(ngModel)]="volunteer.gender">
                            <option value="FEMALE">Female</option>
                            <option value="MALE">Male</option>
                            <option value="OTHER">Other</option>
                          </select>
                        </div>
                      </div>
                    </div>
                  </div>
                  
                  <div class="gap-3 flex flex-col sm:flex-row mb-3 " >
                    <div class="sm:col-span-3 flex-grow sm:w-1/2">
                      <label for="phone" class="block text-sm font-medium leading-6 text-gray-900">Phone Number</label>
                      <div class="mt-2">
                        <div class="flex rounded-md shadow-sm ring-1 ring-inset ring-gray-300 focus-within:ring-2 focus-within:ring-inset focus-within:ring-teal-600 sm:max-w-md md:max-w-xl">
                          <input type="tel" name="phone" id="phone" autocomplete="cc-number" class="block flex-1 border border-gray-300 rounded-md  bg-transparent py-1.5 pl-2 text-gray-900 placeholder:text-gray-400 focus:ring-0 sm:text-sm sm:leading-5" placeholder="+123 4567890" [(ngModel)]="volunteer.phone">
                        </div>
                      </div>
                    </div>
                    <div class="sm:col-span-3 flex-grow sm:w-1/2  sm:mt-0">
                      <label for="birthdate" class="block text-sm font-medium leading-6 text-gray-900">Birthdate</label>
                      <div class="mt-2">
                        <div class="flex rounded-md shadow-sm ring-1 ring-inset ring-gray-300 focus-within:ring-2 focus-within:ring-inset focus-within:ring-teal-600 sm:max-w-md md:max-w-xl">
                          <input type="date" name="birthdate" id="birthdate" class="block flex-1 border border-gray-300 rounded-md  bg-transparent py-1.5 pl-2 text-gray-900 placeholder:text-gray-400 focus:ring-0 sm:text-sm sm:leading-5" [(ngModel)]="volunteer.birthdate">
                        </div>
                      </div>
                    </div>
                  </div>
                  

                  <div class="gap-3  ">
                    <div class="sm:col-span-4 mb-3">
                      <label for="address" class="block text-sm font-medium leading-6 text-gray-900">Address</label>
                      <div class="mt-2">
                        <div class="flex rounded-md shadow-sm ring-1 ring-inset ring-gray-300 focus-within:ring-2 focus-within:ring-inset focus-within:ring-teal-600 sm:max-w-md md:max-w-xl">
                          <input type="text" name="address" id="address" class="block flex-1 border border-gray-300 rounded-md  bg-transparent py-1.5 pl-2 text-gray-900 placeholder:text-gray-400 focus:ring-0 sm:text-sm sm:leading-5" placeholder="e.g. 123 Main St, City, State ZIP" [(ngModel)]="volunteer.address">
                        </div>
                      </div>
                    </div>
                    <div class="sm:col-span-4 mb-3">
                      <label for="password" class="block text-sm font-medium leading-6 text-gray-900">Password</label>
                      <div class="mt-2">
                        <div class="flex rounded-md shadow-sm ring-1 ring-inset ring-gray-300 focus-within:ring-2 focus-within:ring-inset focus-within:ring-teal-600 sm:max-w-md md:max-w-xl">
                          <input type="password" name="password" id="password" class="block flex-1 border border-gray-300 rounded-md  bg-transparent py-1.5 pl-2 text-gray-900 placeholder:text-gray-400 focus:ring-0 sm:text-sm sm:leading-5" placeholder="Password" [(ngModel)]="volunteer.password">
                        </div>
                      </div>
                    </div>
                  </div>
                  

              <div class="gap-3 flex flex-col sm:flex-row my-3">
                <div class="sm:col-span-3 flex-grow sm:w-1/2">
                  <button type="submit" class="rounded-md w-24 bg-green px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-green-light focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-400">Save</button>
                </div>
                <div class="sm:col-span-3 flex-grow sm:w-1/2 flex sm:mt-0 justify-end">
                  <p>Registered already? <a href="/login-volunteer" class="font-semibold text-teal-500">Login</a></p>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
    <!--the registration form for volunteers -->

    </div>
